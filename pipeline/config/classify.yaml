# =============================================================
# mimetics-dsh-weekly-report — 状态分类规则
# 铁律：分类依据必须是素材里的**明确状态描述**，不得按语气或常识推断。
# 判定顺序（implemented in src/classify.py）：
#   1) 同一事项内命中 keywords → 按 hit_resolution 消解（最长优先）
#   2) verb_state_guard 过滤"完成/上线"这类动词型误判（工单标题常见）
#   3) 交叉合并后不同来源状态不一致 → R7 归入〖风险与阻塞〗
#   4) 无任何命中 → unknown，按 unknown_policy 处理（不进四模块）
# =============================================================

status:
  completed:
    label: 已完成
    target_section: completed
    keywords:
      - "已完成"
      - "完成"
      - "已上线"
      - "上线"
      - "已发布"
      - "已发布上线"
      - "已交付"
      - "交付"
      - "已验收"
      - "验收通过"
      - "验收"
      - "已关闭"
      - "关闭"
      - "Done"
      - "DONE"
      - "Closed"
      - "Resolved"
      - "已修复"
      - "修复完成"
      - "修复"            # 光杆动词：需通过 verb_state_guard 的子句条件才算状态
      - "优化"            # 同上（工作日志里"优化数据看板"属已完成动作）
      - "提升"
      - "覆盖"
      - "提测"
      - "联调"
      - "已合并"
      - "merged"
      - "已提测"
      - "已通过"
      - "通过"
      - "已发布到生产"

  in_progress:
    label: 进行中
    target_section: in_progress
    keywords:
      - "进行中"
      - "在做"
      - "正在"
      - "开发中"
      - "调试中"
      - "测试中"
      - "联调中"
      - "已开始"
      - "编写中"
      - "评审中"
      - "待评审"
      - "In Progress"
      - "InReview"
      - "IN PROGRESS"
      - "处理中"
      - "跟进中"
      - "部分完成"
      - "完成一半"
      - "进度"

  blocked:
    label: 受阻/待确认
    target_section: blocked
    keywords:
      - "阻塞"
      - "受阻"
      - "卡住"
      - "卡在"
      - "被阻塞"
      - "Blocked"
      - "BLOCKED"
      - "等待"
      - "待审批"
      - "待确认"
      - "待回复"
      - "待依赖方"
      - "依赖"
      - "缺口"
      - "风险"
      - "延期"
      - "延期风险"
      - "无法推进"
      - "暂停"
      - "搁置"
      - "需要支持"
      - "等对接"
      - "待定"

  planned:
    label: 下周计划
    target_section: next_plan
    keywords:
      - "下周"
      - "下周一"
      - "下周计划"
      - "下周安排"
      - "计划"
      - "打算"
      - "准备"
      - "拟"
      - "Next Week"
      - "TODO"
      - "下个迭代"
      - "待排期"
      - "排期"

# ---- 判定细则 ----
classification:
  # 命中优先级（数字越小越优先）。冲突时高优先级的 status 胜出。
  # 例：「已完成联调，但待审批」→ completed 与 blocked 同时命中 → blocked 优先（更需暴露风险）
  # 用户明确要求：受阻/待确认 必须排在第一位。
  precedence: [blocked, completed, in_progress, planned]

  # 一个事项同时命中多个状态时：
  #   precedence_win   = 按 precedence 取一个（默认）
  #   mark_conflict    = 归入 〖风险与阻塞〗并写明冲突点（铁律 R7）
  #   keep_both        = 两个模块都写（仅调试用，会触发 R6，不推荐）
  multi_match_policy: precedence_win

  # 命中重叠时的消解（重难点）：
  #   同一段文字里 "部分完成" 命中时，内部的 "完成" 不再单独计数
  #   longest_win = 保留最长命中，丢弃被覆盖的短命中（默认）
  hit_resolution: longest_win

  # 状态判定为 unknown 的条目（无明确状态词）：
  #   drop     = 丢弃，不进任何模块
  #   ask_user = 汇总成一条向用户确认（默认；不进四模块，避免撑出第五模块）
  unknown_policy: ask_user

  # 素材自带状态（Jira Status / 会议纪要分节）与关键词判定不一致时：
  #   hint_wins   = 素材自带状态优先（同一来源内部，默认）
  #   注意：**跨素材**合并后状态不一致 → 一律走 R7，不受本项控制
  hint_policy: hint_wins

  # 以下情况强制归入 blocked，不看关键词：
  force_blocked_when:
    - "同一事项在不同素材中状态矛盾"
    - "素材出现疑问句式的未决事项（如「这个谁跟？」）"

  # 语气词不参与判定（防止把「应该完成了」判成 completed）
  ignore_patterns:
    - "应该"
    - "可能"
    - "大概"
    - "好像"
    - "似乎"
    - "估计"

  # 状态词必须出现在同一事项文本内才算命中，跨事项不计
  scope: same_item

# ---- 动词型状态词的防误判（工单标题重灾区）----
# 反例：Jira 标题「完成支付网关对接」（Status=In Progress）里的"完成"是任务名，不是状态。
verb_state_guard:
  enabled: true
  # 只有这些"光杆动词"才需要过 guard；"已完成/已修复"等带完成态标记的不受约束
  verbs: [完成, 交付, 上线, 发布, 修复, 优化, 提测, 联调, 通过, 关闭, 验收, 覆盖, 提升]

  # 判定为"真状态"的条件（满足任一即可，否则丢弃该命中）：
  #   a) 同一个子句内、动词前出现完成态标记
  markers: [已, 已经, 均已, 均, 都, 全部, 刚, 刚刚, 了, 完毕, 结束]

  #   b) 动词正好结束该子句（"看板优化完成"），且子句内没有未来/期限线索
  clause_end_is_state: true
  future_markers: [前, 之前, 以内, 之内, 待, 计划, 预计, 拟, 下周, 下月]
  future_marker_window: 8        # 向前看几个字判断是否处于"期限语句"中

  # 左边紧邻这些词 → 不是完成态（"部分完成"由关键词表单独覆盖）
  left_negators: [未, 没, 没有, 尚未, 还在, 正在, 陆续, 部分]

  # 右边紧跟这些字 → 是名词化的动词（"通过率 98%" 里的"通过"），丢弃
  follow_stop_chars: [率, 度, 量, 者, 中]

# ---- 显式计划语句的优先门（防"计划"被当作普通关键词）----
# 「下周计划：完成风控规则配置」：里边的"完成"不能把这条判成已完成。
future_gate:
  enabled: true
  # 命中任一强计划线索 → 直接判 planned（优先级仅次于 blocked）
  strong_cues: [下周, 下月, 下个迭代, 下一步, 待排期, 待办, 打算, 拟, 排期]
  # 强线索生效时，允许压制这些状态（blocked 永远不被压制）
  suppress: [completed, in_progress]

# =====================================================================
# 数值冲突护栏（v1.1.2，2026-10-13 用户拍板）
#   场景：同一事项被合并后，各来源对**同一对象**报了不同数值
#         （"完成风控规则配置，覆盖 3 条规则" 与 "…覆盖 5 条规则"）。
#   行为：复用 **R7 链路** —— 触发冲突告警（写明两个取值）并**归入〖风险与阻塞〗**；
#         展示层同时不再合成任何形态（不写区间、不并列拼接）。
#   判定键 = 同类型 + 同数值尾部（单位/对象名），与展示层共用 `extract.metric_conflicts`；
#         故 `3 个核心指标` 与 `2 个边界用例` 不会被误判为同一对象。
#   ⚠️ 只处理"数值不一致"，**不改变合并分组与状态判定逻辑**（R8 的语义资产不动）。
# =====================================================================
metric_conflict_guard:
  enabled: true
  marker: "⚠️ 数值冲突："                    # 写入条目时的前缀（区别于状态冲突）
  note_template: "跨素材数值不一致（%s）"     # %s 替换为 "取值1 / 取值2"
